name: Publish to PyPI and NPM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      pypi:
        description: "Publish to PyPI (trusted publishing, no token)"
        type: boolean
        default: true
      npm:
        description: "Publish to npm (NPM_TOKEN secret + provenance)"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distribution
        run: python -m build

      - name: twine check
        run: python -m twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    if: github.event_name == 'release' || inputs.pypi == true
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # for trusted publishing
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  npm:
    if: github.event_name == 'release' || inputs.npm == true
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # for npm provenance
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to NPM
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
