[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icyloom"
version = "1.0.0"
description = "Unified local gateway: LLM cache + compressed context drawer, in a single MCP server"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Malik Belkacemi" }]
keywords = ["mcp", "mcp-server", "cache", "llm", "proxy", "context", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: Proxy Servers",
]
dependencies = [
    "mcp>=1.2,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30",
    "httpx>=0.27,<1",
    "sse-starlette>=2.1",
    "websockets>=12.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "pyahocorasick>=2.1",
    "tiktoken>=0.7",
]

[project.urls]
Homepage = "https://github.com/MlkBlk-IT/icy-loom"
Repository = "https://github.com/MlkBlk-IT/icy-loom"
Issues = "https://github.com/MlkBlk-IT/icy-loom/issues"
Changelog = "https://github.com/MlkBlk-IT/icy-loom/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
qdrant = ["qdrant-client>=1.9"]
vector = ["numpy>=1.24", "faiss-cpu>=1.7"]

[project.scripts]
icyloom = "icyloom.cli:main"


[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
icyloom = ["py.typed", "static/*.html", "static/*.svg", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["timeout: limite de temps pour les tests réseau"]
filterwarnings = ["ignore::DeprecationWarning"]
