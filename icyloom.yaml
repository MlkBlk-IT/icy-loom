upstreams:
- name: hermes
  base_url: http://127.0.0.1:8080/v1
  priority: 10
  kind: openai
  api_key_env: HERMES_CUSTOM_OMNIROUTE_API_KEY
  timeout_seconds: 120.0
  sticky: true
  enabled: true
policy:
  enabled: true
  default_role: reader
  environment: dev
  project_roots: []
  roles:
    operator:
    - server: '*'
      tool: '*'
      effect: allow
