    env:
      BASE_DIRS: '["D:\\Hermes","D:\\LoFT","D:\\Projet Lab-SRV1","D:\\Document Openclaw","D:\\LLM Benchmark","D:\\Redmi Note 10","D:\\99-Archive-Total","D:\\Cours Comptia","D:\\AI","D:\\LabAudit","D:\\Rapports","D:\\Fichier SKILL","D:\\MCP_TEST"]'
      DB_PATH: 'C:\MCP\local-rag\lancedb-v2'
      CHUNK_MIN_LENGTH: '300'
