    cache_enabled: false
    ttl_seconds: 3600
    enabled: true
  - name: local-rag
    command: C:\Program Files\nodejs\node.exe
    args:
    - C:\Users\Tech\AppData\Roaming\npm\node_modules\mcp-local-rag\dist\index.js
    description: RAG local (LanceDB)
    cache_enabled: false
    ttl_seconds: 3600
    enabled: true
    env:
      BASE_DIRS: '["D:\\Hermes","D:\\LoFT","D:\\Projet Lab-SRV1","D:\\Document Openclaw","D:\\LLM
        Benchmark","D:\\Redmi Note 10","D:\\99-Archive-Total","D:\\Cours Comptia","D:\\AI","D:\\LabAudit","D:\\Rapports","D:\\Fichier
        SKILL","D:\\MCP_TEST"]'
      DB_PATH: C:\MCP\local-rag\lancedb-v2
      CHUNK_MIN_LENGTH: '300'
      EMBED_TITLE_PREFIX: 'true'
      EMBED_HEADING_PREFIX: 'true'
      CACHE_DIR: C:\MCP\local-rag\models
  - name: basic-memory
    command: uvx
    args:
    - basic-memory==0.23.2
    - mcp
    description: Memoire basic-memory
    cache_enabled: false
    ttl_seconds: 3600
    enabled: true
  - name: time
