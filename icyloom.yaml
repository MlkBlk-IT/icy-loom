server:
  name: icyloom
  host: 127.0.0.1
  instructions: IcyLoom réunit un cache LLM local et un tiroir de contexte compressé.
    ctx_store sort le gros du contexte et rend une ancre dense ; ctx_get rend les
    octets d'origine ; ctx_verify prouve qu'aucun invariant n'a été perdu. Les actions
    destructrices exigent confirm=true.
  remote_access_token: null
ports:
  gateway_http: 8150
  mcp_http: 8151
  mcp_sse: 8152
  admin: 8153
database:
  path: icyloom.db
  journal_mode: WAL
  busy_timeout_ms: 5000
  synchronous: NORMAL
cache:
  ttl_seconds: 604800
  max_entries: 50000
  semantic_enabled: false
  semantic_threshold: 0.95
  semantic_provider: ''
  semantic_url: ''
  semantic_collection: icyloom
compression:
  enabled: true
  profile: strict
  auto_store_threshold: 500
  max_anchor_chars: 6000
  max_invariants: 40
context:
  session_ttl_days: 30
  redact_enabled: true
  rate_limit_per_minute: 120
  allowed_dirs:
  - D:\Icy-Loom
  - C:\Users\Tech\AppData\Local\hermes\cache\scratch
  - C:\Users\Tech\AppData\Local\hermes
  audit_enabled: true
  audit_retention_days: 30
  sandbox_enabled: true
  sandbox_timeout_seconds: 30.0
breaker:
  failure_threshold: 3
  reset_seconds: 30.0
  half_open_probes: 1
ledger:
  enabled: true
  retention_days: 90
tool_proxy:
  default_ttl_seconds: 3600
  loop_window_seconds: 300
  loop_warn_after: 3
  loop_block_after: 5
  loop_max_cycle: 3
  max_result_bytes: 1048576
  connect_timeout_seconds: 20.0
  call_timeout_seconds: 300.0
  servers:
  - name: github
    command: 'D:\AI-Stack\tools\github-mcp-server\2.0.2\github-mcp-server.exe'
    args:
    - stdio
    description: GitHub repos/PR/issues (binaire local AI-Stack)
    cache_enabled: true
    ttl_seconds: 3600
    enabled: true
  - name: filesystem
    command: npx
    args:
    - '@modelcontextprotocol/server-filesystem'
    - 'C:\'
    - 'D:\'
    description: Fichiers locaux controles (memes racines que Claude Desktop)
    cache_enabled: true
    # TTL court : l'epoch invalide le cache a chaque ecriture RELAYEE, mais
    # une ecriture faite hors du relais (editeur, autre process) ne change pas
    # l'epoch. 5 min = fenetre maximale de perimption.
    ttl_seconds: 300
    # Allowlist stricte : lectures idempotentes seulement (deny-by-default).
    cache_tools:
      read_text_file: true
      read_file: true
      get_file_info: true
      list_directory: true
    enabled: true
  - name: chrome-devtools
    command: 'C:\Program Files\nodejs\node.exe'
    args:
    - 'D:\AI-Stack\envs\chrome-devtools-mcp\node_modules\chrome-devtools-mcp\build\src\bin\chrome-devtools-mcp.js'
    - --isolated
    - --headless
    - '--executablePath=C:\Program Files\Google\Chrome\Application\chrome.exe'
    description: Chrome DevTools (binaire local AI-Stack)
    cache_enabled: true
    ttl_seconds: 3600
    enabled: true
  - name: sqlite
    command: uvx
    args:
    - --python
    - '3.12'
    - --from
    - 'mcp-server-sqlite==2025.4.25'
    - --with
    - 'mcp==1.9.4'
    - --with
    - 'pydantic==2.8.2'
    - mcp-server-sqlite
    - --db-path
    - 'D:\Icy-Loom\var\mcp-sqlite.db'
    description: "SQLite (Anthropic) - release epinglee + SDK mcp/pydantic epingles (la 2025.4.25 exige un SDK ancien) + base explicite"
    cache_enabled: true
    ttl_seconds: 3600
    enabled: true
  - name: everything
    command: uvx
    args:
    - mcp-server-everything
    description: Serveur test/reference MCP - paquet ABSENT de PyPI (npm seulement)
    cache_enabled: true
    ttl_seconds: 3600
    enabled: false
  - name: fetch
    command: uvx
    args:
    - mcp-server-fetch==2026.10.10
    description: Web fetch -> markdown (Anthropic) - 801k downloads
    cache_enabled: true
    ttl_seconds: 3600
    enabled: true
  - name: memory
    command: npx
    args:
    - '@modelcontextprotocol/server-memory'
    description: Memoire graphe de connaissances (Anthropic)
    cache_enabled: true
    ttl_seconds: 3600
    enabled: true
  - name: git
