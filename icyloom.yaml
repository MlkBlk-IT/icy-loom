  - name: pwsh
    command: C:\Users\Tech\Documents\PowerShell\Modules\PowerShell.MCP\1.16.0\bin\win-x64\PowerShell.MCP.Proxy.exe
    args:
    - --no-profile
    description: PowerShell via le proxy MCP (bac a sable du module)
    cache_enabled: false
    ttl_seconds: 3600
    enabled: true
  - name: desktop-commander
    command: C:\Program Files\nodejs\node.exe
    args:
    - C:\Users\Tech\AppData\Roaming\npm\node_modules\@wonderwhy-er\desktop-commander\dist\index.js
