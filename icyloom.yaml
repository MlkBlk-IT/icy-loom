upstreams:
- name: hermes
  base_url: http://127.0.0.1:8080/v1
  priority: 10
  kind: openai
  api_key_env: HERMES_CUSTOM_OMNIROUTE_API_KEY
  timeout_seconds: 120.0
  sticky: true
  enabled: true

#: Politique d'execution (V2) : roles, portee projet, approbations.
#: `reader` et `writer` n'ont pas de regle ici : leurs capacites sont
#: definies par defaut (lecture seule / lecture + ecriture).
policy:
  enabled: true
  # Les clients agents ne sont pas administrateurs de la machine : ils n'ont
  # que les racines qu'ils declarent (protocole MCP) et le role `reader`
  # (lecture seule). L'administrateur garde son propre acces hors du proxy.
  default_role: reader
  environment: dev
  # Aucune racine ajoutee : IcyLoom ne complete plus les racines declarees
  # par le client. Liste vide = pas de controle de portee par la politique
  # (les serveurs descendants gardent leurs propres racines declarees).
  project_roots: []
  roles:
    operator:
    - server: '*'
      tool: '*'
      effect: allow
