name: icyloom
version: "2.2.1"
description: "IcyLoom — Unified local gateway: LLM cache + lossless compressed context drawer in a single MCP server. 21 tools, SQLite+FTS5, zero-loss retrieval (retrievable=1.0), 248 tests passing."
author: "Malik Belkacemi (MlkBlk-IT)"
license: MIT
homepage: "https://github.com/MlkBlk-IT/icy-loom"
repository: "https://github.com/MlkBlk-IT/icy-loom"
requires_hermes: ">=0.21.5"
provides_tools:
  - cache
  - ctx_admin
  - ctx_check
  - ctx_get
  - ctx_profile
  - ctx_session
  - ctx_store
  - ctx_verify
  - gateway_stats
  - invoke_tool
  - ledger
  - list_prompts
  - list_resources
  - proxy_info
  - read_resource
  - run_tool_script
  - search_tools
  - tool_cache_clear
  - tool_drift
  - tool_policy
  - tool_simulate
provides_hooks: []
entrypoints:
  python: "__init__.py"
disclosures:
  network: true
  shell: true
  background: true
  # network: outbound to LLM upstreams (OpenAI-compatible), tool servers (npx/uvx)
  # shell: spawns tool servers via npx, uvx, node, python
  # background: runs gateway (8150), MCP HTTP (8151), MCP SSE (8152), admin API (8153)
categories:
  - mcp-server
  - context-engineering
  - cache
  - local-first
  - cpu-only
tags:
  - mcp
  - context-drawer
  - llm-cache
  - sqlite
  - fts5
  - lossless
  - zero-token
  - tool-relay
  - governance